name: englishme
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.3
  get: ^4.7.3
  google_sign_in: ^6.2.1
  firebase_auth: ^5.0.0
  firebase_core: ^3.0.0
  dio: ^5.4.0
  flutter_tts: ^4.2.0
  audioplayers: ^6.1.0
  flutter_markdown_plus: ^1.0.7
  shared_preferences: ^2.5.3
  speech_to_text: ^7.0.0
  permission_handler: ^11.3.1
  url_launcher: ^6.3.0
  record: ^5.1.2
  path_provider: ^2.1.4

dependency_overrides:
  record_linux: ^1.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner:
  flutter_gen_runner:
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon-app-english-me.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/locales/
    - assets/sounds/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
    - family: Baloo2
      fonts:
        - asset: assets/fonts/Baloo2-Variable.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Variable.ttf

# Đặt ở cuối file pubspec.yaml, không thụt đầu dòng
flutter_gen:
  output: lib/gen/
  line_length: 80
  integrations:
    flutter_svg: true